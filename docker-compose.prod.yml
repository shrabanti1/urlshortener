# Production overlay. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from development:
#   - nginx terminates TLS on 80/443 instead of publishing 8081
#   - certbot renews certificates automatically
#   - log rotation is bounded so disks cannot fill
#   - postgres is tuned slightly and never exposed

services:
  postgres:
    # No ports: ever. The database is reachable only on the backend network.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-50}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}

  redis:
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    # Pull a prebuilt image instead of compiling on the server. Set IMAGE in
    # .env, e.g. IMAGE=ghcr.io/yourname/urlshortener
    # Falls back to a local build if IMAGE is unset.
    image: ${IMAGE:-urlshortener-app}:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    # Drop the base file's build section so a stray `up --build` can never
    # try to compile C++ on a 1 GB server.
    build: !reset null
    environment:
      BASE_URL: https://${DOMAIN:?DOMAIN must be set}
      LOG_LEVEL: INFO
      # Shorter tokens in production: a JWT cannot be revoked, so the expiry
      # window is the whole blast radius of a stolen token.
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-30}
    # Give the app time to flush buffered click events on SIGTERM.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits: { memory: "${APP_MEMORY_LIMIT:-320M}" }

  nginx:
    # Pull the prebuilt image rather than compiling the frontend on the server.
    image: ${NGINX_IMAGE:-urlshortener-nginx}:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: !reset null
    # !override, not a plain list: Compose APPENDS sequences when merging
    # files, so without it the base file's "${HTTP_PORT}:80" stays published.
    # Docker writes its own iptables rules ahead of ufw's, so that port would
    # be reachable from the internet regardless of the firewall.
    ports: !override
      - "80:80"
      - "443:443"
    # Same reason, and worse here: the base file bind-mounts nginx.conf
    # read-only at the very path the command below writes with envsubst.
    # Appending would make nginx fail with "Read-only file system".
    volumes: !override
      # envsubst is not available, so the template is rendered at start-up by
      # substituting ${DOMAIN}. See the command below.
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.template.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    command: >
      /bin/sh -c "
        envsubst '$$DOMAIN' < /etc/nginx/nginx.template.conf > /etc/nginx/nginx.conf &&
        nginx -t &&
        while :; do sleep 12h & wait $${!}; nginx -s reload; done & 
        nginx -g 'daemon off;'
      "
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Wakes twice a day and renews anything within 30 days of expiry.
    # Let's Encrypt certificates last 90 days, so this has wide margin.
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
      "
    networks: [frontend]
    restart: unless-stopped

volumes:
  certbot_conf:
  certbot_www:
