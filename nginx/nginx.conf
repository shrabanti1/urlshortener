worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time separates "our app was slow" from "the network
    # was slow", which is the first thing you want when diagnosing latency.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;   # do not advertise the nginx version

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # ---- Rate limiting ----------------------------------------------------
    # Two zones, because these endpoints have very different risk profiles.
    #
    # 10m of shared memory holds roughly 160,000 addresses.
    limit_req_zone $binary_remote_addr zone=redirects:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api:10m       rate=10r/s;
    # Login/register are brute-force targets, so they get the tightest limit.
    limit_req_zone $binary_remote_addr zone=auth:10m      rate=1r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Which origins may call the API from a browser. The value is echoed back
    # only when it matches, so an arbitrary site cannot read authed responses.
    # "" means no CORS header is sent at all, which blocks the request.
    map $http_origin $cors_origin {
        default                                      "";
        "~^http://localhost:(8080|8081|8082|3000|5173)$"  $http_origin;
        "~^http://127\.0\.0\.1:(8080|8081|8082|3000|5173)$" $http_origin;
    }

    upstream app {
        server app:8080;
        keepalive 32;   # reuse connections instead of a handshake per request
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 64k;   # this API only ever receives small JSON

        # Basic hardening headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        limit_conn conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # The app reads X-Forwarded-For for analytics. Setting it here
        # OVERWRITES anything the client sent, so it cannot be forged.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # The web UI. "= /" is an EXACT match, so it serves the page at the
        # root without shadowing "/{shortCode}", which is matched by the
        # prefix "location /" below.
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Vite emits hashed filenames under /assets/, so they can be cached
        # hard: a new build produces a new name. Without this they fall through
        # to "location /" and get proxied to the app, which 404s them.
        location ^~ /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Swagger UI and the spec, served straight from this image -- the Vite
        # build bakes them in, so no separate container is needed. Same origin
        # as the API, so "Try it out" is not a cross-origin request.
        # "docs" is therefore a reserved word and can never be a short code.
        location ^~ /docs {
            root /usr/share/nginx/html;
            try_files $uri $uri/ $uri/index.html =404;
        }

        # Health check: not rate limited, not logged.
        location = /health {
            access_log off;
            proxy_pass http://app;
        }

        location ^~ /api/auth/ {
            # A browser sends OPTIONS first for any request carrying custom
            # headers. It must be answered WITHOUT auth and without counting
            # against the rate limit.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age       86400 always;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app;
        }

        location ^~ /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age       86400 always;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app;
        }

        # Everything else is a short code. Highest limit: this is the hot path.
        location / {
            limit_req zone=redirects burst=100 nodelay;
            proxy_pass http://app;
        }
    }
}
