worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    limit_req_zone $binary_remote_addr zone=redirects:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api:10m       rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m      rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream app {
        server app:8080;
        keepalive 32;
    }

    # ---- HTTP: only for the ACME challenge and redirecting to HTTPS --------
    server {
        listen 80;
        server_name ${DOMAIN};

        # Certbot writes its proof-of-ownership file here. This must stay on
        # plain HTTP: it is how renewal works, every 60 days, forever.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        # TLS 1.2+ only. TLS 1.0/1.1 are deprecated and broken.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;   # modern guidance: let the client choose
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS: tells browsers to refuse plain HTTP for this domain.
        # Only enable once HTTPS definitely works -- browsers cache it hard.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        client_max_body_size 64k;
        limit_conn conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /health {
            access_log off;
            proxy_pass http://app;
        }

        location ^~ /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app;
        }

        location ^~ /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app;
        }

        location / {
            limit_req zone=redirects burst=100 nodelay;
            proxy_pass http://app;
        }
    }
}
