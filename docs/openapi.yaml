openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
  description: |
    A URL shortener built in C++ with Drogon, PostgreSQL and Redis.

    Short codes are produced by permuting the database id (multiplication modulo
    62^6, a bijection) and then Base62-encoding it. Distinct ids therefore always
    produce distinct 6-character codes, with no collision checks, while
    consecutive ids are scattered so the code space cannot be enumerated.

    Redirects are `302 Found`, not `301`. A permanent redirect would be cached
    by browsers indefinitely, which would break click analytics and make a URL
    impossible to change or delete.

servers:
  # Same origin as the Swagger page itself, so "Try it out" is not a
  # cross-origin request.
  - url: http://localhost:8081
    description: Local Docker Compose
  - url: https://short.example.com
    description: Production

tags:
  - name: Public
    description: No authentication required
  - name: Auth
    description: Registration and login
  - name: URLs
    description: Managing your own short URLs
  - name: Analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send the token from register/login as `Authorization: Bearer <token>`.
        Tokens are HS256-signed and expire after `JWT_EXPIRY_MINUTES`
        (60 in development, 30 in production).

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: url must start with http:// or https://
      required: [error]

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          example: correct-horse-battery-staple

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT. Stateless, so it cannot be revoked.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Seconds until the access token expires
          example: 900
        refreshToken:
          type: string
          description: |
            Opaque 256-bit token, returned only here. The server stores only a
            SHA-256 of it. Exchange it at `/api/auth/refresh`; it is rotated on
            every use, and replaying a rotated token revokes every session for
            that user.
          example: 3a9dba9e8336de75c1f0...
        refreshExpiresIn:
          type: integer
          description: Seconds until the refresh token expires
          example: 2592000
        user:
          type: object
          properties:
            id:    { type: integer, format: int64, example: 1 }
            email: { type: string,  example: alice@example.com }

    CreateUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Must use http or https, and contain no spaces.
          example: https://example.com/a/very/long/url
        alias:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^[0-9A-Za-z][0-9A-Za-z_-]*[0-9A-Za-z]$'
          description: |
            Optional custom short code. Letters, numbers, hyphens and
            underscores; must start and end with a letter or number.
            Reserved words that would shadow a real route (`api`, `docs`,
            `health`, ...) are rejected with 400. An alias already in use
            returns 409 -- unlike a generated code, which silently retries.
          example: my-blog
        expiresInDays:
          type: integer
          minimum: 0
          maximum: 3650
          default: 0
          description: 0 (the default) means the link never expires.
          example: 30

    CreateUrlResponse:
      type: object
      properties:
        shortCode: { type: string, example: "1000" }
        shortUrl:  { type: string, example: http://localhost:8081/1000 }

    UrlListItem:
      type: object
      properties:
        shortCode:   { type: string, example: my-blog }
        shortUrl:    { type: string, example: http://localhost:8081/my-blog }
        originalUrl: { type: string, example: https://example.com/a/very/long/url }
        createdAt:   { type: string, example: "2026-08-30 11:36:00.913602+05:30" }
        isCustom:    { type: boolean, description: true if the code was user-chosen }
        expiresAt:
          type: string
          description: Empty string means the link never expires.
          example: "2026-10-04 11:36:00+05:30"
        expired:     { type: boolean, description: Evaluated by the database, not the client }

    UrlList:
      type: object
      properties:
        urls:   { type: array, items: { $ref: '#/components/schemas/UrlListItem' } }
        count:  { type: integer, example: 2 }
        limit:  { type: integer, example: 50 }
        offset: { type: integer, example: 0 }

    Stats:
      type: object
      properties:
        shortCode:      { type: string,  example: "1000" }
        originalUrl:    { type: string,  example: https://example.com/tracked }
        totalClicks:    { type: integer, format: int64, example: 1523 }
        todayClicks:    { type: integer, format: int64, example: 83 }
        uniqueVisitors:
          type: integer
          format: int64
          description: Distinct salted IP hashes. Raw IPs are never stored.
          example: 412
        lastClickedAt:  { type: string, example: "2026-08-30 11:36:00.913602+05:30" }
        expiresAt:      { type: string, description: Empty string means never }
        expired:        { type: boolean }
        dailyClicks:
          type: array
          description: |
            One point per day for the requested window, including days with no
            clicks. Zero-filled server-side with generate_series, so a chart
            cannot silently omit quiet days.
          items:
            type: object
            properties:
              date:   { type: string, example: "2026-09-04" }
              clicks: { type: integer, format: int64, example: 5 }
        topReferrers:
          type: array
          items:
            type: object
            properties:
              source: { type: string,  example: https://twitter.com/post/1 }
              clicks: { type: integer, format: int64, example: 5 }

  responses:
    Unauthorized:
      description: Missing, malformed, or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid or expired token }
    NotFound:
      description: |
        Not found. Returned both when the short code does not exist and when it
        belongs to another user, so this endpoint cannot be used to discover
        which codes exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: |
        Rate limit exceeded (enforced by nginx). Auth endpoints allow 1 req/s
        with a burst of 5; other API endpoints 10 req/s; redirects 50 req/s.

paths:
  /:
    get:
      tags: [Public]
      summary: Service name
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string, example: URL Shortener API }

  /health:
    get:
      tags: [Public]
      summary: Liveness probe
      description: Performs a real `SELECT 1` against PostgreSQL.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              example: { status: ok, database: connected }
        '503':
          description: Database unreachable
          content:
            application/json:
              example: { status: error, database: unreachable }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: Passwords are hashed with Argon2id and never stored in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered (case-insensitive)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a token
      description: |
        Returns an identical error for "no such user" and "wrong password", and
        performs a dummy hash when the user does not exist, so neither the
        response nor its timing reveals which emails are registered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              example: { error: invalid email or password }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: |
        Rotates the refresh token: the presented token is revoked and a new one
        is returned. Replaying an already-rotated token is treated as theft and
        revokes every session belonging to that user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Unknown, expired, revoked, or already-rotated token. The same
            response is returned for all cases.
          content:
            application/json:
              example: { error: invalid or expired refresh token }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      description: |
        Idempotent, and always returns 204 even for an unknown token, so it
        cannot be used to probe which tokens exist. Pass `allDevices: true` to
        revoke every session for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
                allDevices:
                  type: boolean
                  default: false
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/urls:
    post:
      tags: [URLs]
      summary: Create a short URL
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUrlRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The requested alias is already taken
          content:
            application/json:
              example: { error: that alias is already taken }
    get:
      tags: [URLs]
      summary: List your URLs, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/urls/{shortCode}:
    delete:
      tags: [URLs]
      summary: Delete one of your URLs
      description: Also removes its click history and invalidates the cache entry.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shortCode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9A-Za-z_-]{1,16}$' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/urls/{shortCode}/stats:
    get:
      tags: [Analytics]
      summary: Click analytics for one of your URLs
      security: [{ bearerAuth: [] }]
      parameters:
        - name: shortCode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9A-Za-z_-]{1,16}$' }
        - name: days
          in: query
          description: Window for `dailyClicks`. Clamped to 1-90.
          schema: { type: integer, default: 30, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /{shortCode}:
    get:
      tags: [Public]
      summary: Redirect to the original URL
      description: |
        Served from Redis when warm, PostgreSQL otherwise. The click is recorded
        asynchronously *after* the redirect is sent, so analytics never add
        latency to the user's request.
      parameters:
        - name: shortCode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9A-Za-z_-]{1,16}$' }
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema: { type: string }
              description: The original URL
        '404': { description: No such short code }
        '410':
          description: |
            The link existed but has expired. Distinct from 404 on purpose:
            crawlers drop a 410 from their index far faster than a 404.
        '429': { $ref: '#/components/responses/TooManyRequests' }
